name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath -o "bin/$3" -ldflags "-s -w -X main.version=$VERSION"
          }
          build linux   386   modini-386
          build linux   amd64 modini-amd64
          build linux   arm   modini-arm
          build linux   arm64 modini-arm64
          build darwin  amd64 modini-darwin
          build darwin  arm64 modini-darwin-arm64
          build windows 386   modini-386.exe
          build windows amd64 modini-amd64.exe
          build windows arm64 modini-arm64.exe
          cd bin
          sha256sum modini* | tee SHA256SUMS
          ls -l
      # Safe to re-run: the release is created as a draft, files are replaced
      # if already uploaded, and it is only published once every file is up.
      # Tags with a "-" (v1.0.0-rc1) are pre-releases and never marked Latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" bin/* --clobber
          gh release edit "$TAG" --draft=false "${flags[@]}"
